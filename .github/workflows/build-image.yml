name: Build and push image to GitHub Container Registry

on:
  workflow_call:
    inputs:
      is_beta_version:
        description: Publish the image with the beta tag
        required: false
        type: boolean
        default: false
    secrets:
      TRUSTPKG_GHCR:
        required: false

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      tags: ${{ steps.image.outputs.tags }}
    env:
      IS_BETA_VERSION: ${{ inputs.is_beta_version }}
    steps:
      - name: Determine image tags
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            image_tags=("beta-pr-${PR_NUMBER}")
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            image_tags=("$REF_NAME")
            if [[ "$IS_BETA_VERSION" != "true" ]]; then
              image_tags+=("latest")
            fi
          elif [[ "$IS_BETA_VERSION" == "true" ]]; then
            image_tags=("beta")
          else
            image_tags=("latest")
          fi

          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            printf '%s\n' "${image_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-26.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      NODE_VERSION: "26.12.1"
      PNPM_VERSION: "12.15.0"
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      ARCHITECTURE: ${{ matrix.architecture }}
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Log in to GitHub Container Registry
        if: env.PUSH_IMAGE == 'true'
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.TRUSTPKG_GHCR }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" |
            podman login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build image
        env:
          IMAGE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
        run: |
          podman build \
            --platform "linux/$ARCHITECTURE" \
            --build-arg "NODE_VERSION=$NODE_VERSION" \
            --build-arg "PNPM_VERSION=$PNPM_VERSION" \
            --label "org.opencontainers.image.source=https://github.com/trustpkg/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            .

      - name: Push architecture image
        if: env.PUSH_IMAGE == 'true'
        env:
          IMAGE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.architecture }}
        run: podman push "$IMAGE_NAME:$IMAGE_TAG"

  publish:
    needs:
      - prepare
      - build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      IMAGE_TAGS: ${{ needs.prepare.outputs.tags }}
    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.TRUSTPKG_GHCR }}
        run: |
          printf '%s' "$REGISTRY_PASSWORD" |
            podman login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Publish multi-platform manifest
        env:
          AMD64_IMAGE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          ARM64_IMAGE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}-arm64
        run: |
          while IFS= read -r image_tag; do
            [[ -z "$image_tag" ]] && continue
            manifest="$IMAGE_NAME:$image_tag"
            podman manifest create "$manifest"
            podman manifest add "$manifest" "docker://$IMAGE_NAME:$AMD64_IMAGE_TAG"
            podman manifest add "$manifest" "docker://$IMAGE_NAME:$ARM64_IMAGE_TAG"
            podman manifest push --all "$manifest" "docker://$manifest"
          done <<< "$IMAGE_TAGS"
