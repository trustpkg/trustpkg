name: workflow
on:
  pull_request:
jobs:
  code-checks:
    uses: ./.github/workflows/code-checks.yml

  build:
    uses: ./.github/workflows/build.yml
    needs: code-checks

  vulnerabilities-audit:
    uses: ./.github/workflows/vulnerabilities.yml
    needs: code-checks

  build-image:
    uses: ./.github/workflows/build-image.yml
    needs:
      - code-checks
      - build
      - vulnerabilities-audit
    secrets:
      TRUSTPKG_GHCR: ${{ secrets.TRUSTPKG_GHCR }}
    with:
      is_beta_version: true
    permissions:
      contents: read
      packages: write
