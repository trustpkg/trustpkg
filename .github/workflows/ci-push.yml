name: workflow
on:
  push:
    branches:
      - main
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  build-image:
    uses: ./.github/workflows/build-image.yml
    secrets:
      TRUSTPKG_GHCR: ${{ secrets.TRUSTPKG_GHCR }}
    with:
      is_beta_version: ${{ contains(github.ref_name, '-beta') }}
    permissions:
      contents: read
      packages: write
